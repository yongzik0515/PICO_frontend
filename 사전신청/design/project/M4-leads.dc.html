<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {

    this.state = { step: 4, on: false };
  }
  renderVals() {
    const s = this.state.step;
    const on = this.state.on;
    const set = (p) => this.setState(p);
    const wrap = (n, shape) => 'position: relative; ' + shape + (s === n ? ' z-index: 30;' : '');
    return {
      progN: s === 4 ? 4 : 5,
      progW: (s === 4 ? 4 : 5) / 15 * 100 + '%',
      s4: s === 4,
      s6: s === 6,
      w4: wrap(4, 'flex: 1; border-radius: 12px;'),
      w6: wrap(6, 'border-radius: 16px;'),
      on: on,
      onLabel: on ? 'ON' : 'OFF',
      trackStyle: 'position: relative; display: inline-block; width: 36px; height: 22px; border-radius: 999px; transition: background 0.2s; background: ' + (on ? '#3A5BFF' : '#C2C8D3'),
      knobStyle: 'position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: left 0.2s; left: ' + (on ? '17px' : '3px'),
      toggle: () => set(s === 4 ? { on: true, step: 6 } : { on: !on }),
    };
  }
}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  renderVals() {
    const s = this.state.step;
    const set = (p) => this.setState(p);
    return {
      welcome: s === 0,
      tour: s === 1,
      resting: s === -1,
      start: () => set({ step: 1 }),
      later: () => set({ step: -1 }),
      reopen: () => set({ step: 0 }),
    };
  }
}
</script>
